# docs: build the Sphinx site on every pull request, and publish main to GitHub Pages.
#
# The build is the same command as locally (docs/conf.py): `-W` makes any warning fatal, so a
# broken `|Name|` substitution or cross-reference fails the PR, and `-E` rebuilds from scratch.
# The guides' code samples are checked by tests/test_guides.py in the tests workflow, not here.
#
# Publishing needs Pages enabled with "GitHub Actions" as the source (Settings -> Pages).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Never cancel a deploy part-way; a newer PR push does make the older build pointless.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build
        run: sphinx-build -W -E -b html docs docs/_build/html

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
