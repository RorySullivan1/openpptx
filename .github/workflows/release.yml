# release: publish to PyPI when a version tag is pushed.
#
# Push an annotated tag `v<version>` on a commit whose pyproject.toml carries that version, e.g.
# `v1.0.0rc1` for `version = "1.0.0rc1"`. The workflow then:
#   1. checks the tag matches the package version, builds the sdist and wheel, and runs
#      `twine check --strict` on them;
#   2. installs the built wheel (not the source tree) into a clean Python 3.9 and 3.13 and runs
#      every examples/ script against it;
#   3. publishes both files to PyPI by Trusted Publishing: no token is stored anywhere;
#   4. creates the GitHub Release for the tag, with that version's CHANGELOG.md section as its notes
#      and the same two files attached. A pre-release version is marked as a pre-release.
#
# A final version must have a dated CHANGELOG section before anything is published (step 1 checks
# with .github/scripts/release_notes.py), so a version never reaches PyPI without its notes.
#
# Step 3 needs a trusted publisher on PyPI (owner RorySullivan1, repo openpptx, workflow
# release.yml, environment pypi) and a `pypi` environment in this repo's settings. A version with a
# pre-release suffix (1.0.0rc1) is published too. A plain `pip install openpptx` skips it once a final
# release exists, but takes it while it is the only version (checked with pip 26 and uv, 1.0.0rc1).
#
# A tag runs the workflow file of the commit it points at, so tagging a commit from before this
# file existed (the historical v0.x tags in .meta/release-tags.md) publishes nothing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        run: |
          version="$(python - <<'EOF'
          import re
          with open("pyproject.toml", encoding="utf-8") as f:
              print(re.search(r'^version = "([^"]+)"', f.read(), re.M).group(1))
          EOF
          )"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          echo "Releasing openpptx $version"

      - name: Check CHANGELOG.md has notes for this version
        run: python .github/scripts/release_notes.py "${GITHUB_REF_NAME#v}" --check

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    needs: build
    name: wheel on py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      # -- only for examples/; the scripts must import the installed wheel, not this tree --
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Run the example scripts against it
        run: |
          cd "$(mktemp -d)"
          python -c "import openpptx, sys; print(openpptx.__version__, openpptx.__file__); sys.exit('site-packages' not in openpptx.__file__)"
          failed=0
          for script in "$GITHUB_WORKSPACE"/examples/*.py; do
            name="$(basename "$script")"
            # batch_process.py takes IN_DIR/OUT_DIR arguments; tests.yml skips it too
            if [ "$name" = "batch_process.py" ]; then continue; fi
            if output="$(python "$script" 2>&1)"; then
              echo "  ok    $name"
            else
              echo "::error::$name exited non-zero"
              echo "$output" | tail -20
              failed=1
            fi
          done
          exit $failed

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openpptx/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # -- the files PyPI received, byte for byte; not a rebuild --
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python .github/scripts/release_notes.py "$version" > notes.md
          flags=()
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # -- a re-run of this job: refresh the notes and files instead of failing --
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag               --title "openpptx $version" --notes-file notes.md "${flags[@]}"
          fi
