[build-system]
# setuptools 77 is the first to read the PEP 639 `license` expression and `license-files`.
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openpptx"
version = "0.7.1"
description = "Create, read, and modify PowerPoint .pptx files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# -- carries the owner's notice and python-pptx's, which this code is derived from --
license-files = ["LICENSE"]
authors = [{ name = "Rory Sullivan" }]
keywords = ["powerpoint", "pptx", "ooxml", "office", "presentation", "slides"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=4.9",
    "typing_extensions>=4.4",
    "XlsxWriter>=3.0",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/RorySullivan1/openpptx"
Documentation = "https://rorysullivan1.github.io/openpptx/"
Source = "https://github.com/RorySullivan1/openpptx"
Issues = "https://github.com/RorySullivan1/openpptx/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # tests/unitutil/cxml.py parses the compact XML expression language with pyparsing.
    # Capped below 4: it still calls `delimitedList`, `setParseAction`, `dblQuotedString`
    # and `removeQuotes`, which 3.x deprecates (the suite emits the warnings) and 4.x is
    # expected to remove.
    "pyparsing>=3.0,<4",
    # tests/oxml/test_simpletypes_properties.py: property-based tests of the simple types.
    "hypothesis>=6",
]
# Builds the API reference in docs/: `sphinx-build -W -b html docs docs/_build/html`.
docs = [
    # sphinx-autodoc-typehints 3.x already warns of APIs Sphinx 10 removes.
    "sphinx>=7,<10",
    "sphinx-autodoc-typehints>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
python_classes = ["Describe*"]
python_functions = ["it_*", "and_it_*", "but_it_*", "test_*", "bench_*"]
markers = [
    "perf: opt-in performance benchmark (run with `pytest -m perf`)",
    "realworld: round-trip tests over the Apache POI corpus in tests/test_files/real_world/",
]
addopts = "-m 'not perf'"
